short_bio: >-
  <p>
    Hi! I‘m a 2nd year PhD student in Psychology at Johns Hopkins University, advised by Dr. <strong>Shari Liu</strong> at the <a href="https://www.liulaboratory.org/home" target="_blank">Look, Infer, and Understand Lab</a>. 
    Interested in social cognition, I use behavioral and fMRI approaches to explore how people's understanding of other agents’ actions interact with their physical and biological reasoning in both children and adults.
  </p>
  <p>
    Outside of research, I enjoy live music🎶, playing electric guitar🎸, and open-world games🎮.
  </p>

